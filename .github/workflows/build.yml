name: Build playable Linux and Windows ZIPs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTENT_SHA: 7b2fdf4691fe6844aa4c69450a88b68d166289d1

jobs:
  build-linux:
    name: Build Linux x86-64 portable ZIP
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: Install cloud build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build pkg-config python3 \
            patchelf libsdl2-dev libpng-dev libogg-dev libvorbis-dev zlib1g-dev
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out matching content
        uses: actions/checkout@v6
        with:
          repository: JHGuitarFreak/UQM-MegaMod-Content
          ref: ${{ env.CONTENT_SHA }}
          path: content-source
          persist-credentials: false
      - name: Configure and compile release
        run: |
          cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Release -DUQM_DEBUG=OFF
          cmake --build out --parallel 2
      - name: Package game, content, libraries and licenses
        run: python3 .github/scripts/portable.py package linux out/UrQuanMasters content-source
      - name: Upload exact Linux ZIP
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/UQM-MegaMod-linux-x86_64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows x86-64 portable ZIP
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out matching content
        uses: actions/checkout@v6
        with:
          repository: JHGuitarFreak/UQM-MegaMod-Content
          ref: ${{ env.CONTENT_SHA }}
          path: content-source
          persist-credentials: false
      - name: Install 64-bit MinGW tools on the cloud runner
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-zlib
      - name: Configure and compile release
        run: |
          cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Release -DUQM_DEBUG=OFF
          cmake --build out --parallel 2
      - name: Package game, content, recursive DLL dependencies and licenses
        run: python .github/scripts/portable.py package windows out/UrQuanMasters.exe content-source
      - name: Upload exact Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: dist/UQM-MegaMod-windows-x86_64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  test-linux:
    name: Test Linux ZIP on Ubuntu ${{ matrix.ubuntu }}
    needs: build-linux
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - name: Install test harness only (no SDL or development packages)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 xvfb xauth
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64
          path: dist
      - name: Verify extracted archive from an unrelated working directory
        run: xvfb-run -a python3 .github/scripts/portable.py smoke dist/UQM-MegaMod-linux-x86_64.zip

  test-windows:
    name: Test Windows ZIP without MSYS2
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
          path: dist
      - name: Verify extracted archive with development tools removed from game PATH
        run: python .github/scripts/portable.py smoke dist/UQM-MegaMod-windows-x86_64.zip

  publish:
    name: Publish the two verified playable ZIPs
    needs: [test-linux, test-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-x86_64'
          merge-multiple: true
          path: dist
      - name: Publish versioned prerelease and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          tag="portable-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "Complete offline game packages for Windows x86-64 and Linux x86-64."
            echo
            echo "Extract the whole ZIP. Windows: launch Play.cmd. Linux: launch ./Play.sh."
            echo "Linux requires glibc 2.35+ (Ubuntu 22.04+) and host graphics/audio drivers."
            echo
            echo "Includes base/HD/voice/mode content, runtime libraries, licenses, exact game source and build manifest."
            echo "Validated archive checksums and graphical startup on Windows and Ubuntu 22.04/24.04."
            echo "Startup smoke checks do not replace manual gameplay, audio or controller testing."
            echo
            echo "Game commit: $GITHUB_SHA"
            echo "Content commit: $CONTENT_SHA"
            echo
            echo 'SHA-256:'
            echo '~~~text'
            (cd dist && sha256sum *.zip)
            echo '~~~'
          } > release-notes.md
          gh release create "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Playable portable builds $GITHUB_RUN_NUMBER" --notes-file release-notes.md
          echo "Download both ZIPs: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
